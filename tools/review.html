<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quizilla review</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #677085; --line: #dfe3ea;
    --accent: #4f5bd5; --ok: #1f8a4c; --ok-bg: #e5f5ec; --bad: #c0392b; --bad-bg: #fbe9e7;
    --warn: #9a6700; --warn-bg: #fff4d6; --code-bg: #1e2230; --code-text: #e6e8ef;
    --kw: #c792ea; --str: #c3e88d; --num: #f78c6c; --com: #7f8aa3; --type: #82aaff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b1f29; --text: #e6e8ef; --muted: #98a1b5; --line: #2c3240;
      --accent: #8b95ff; --ok: #5fd08e; --ok-bg: #173323; --bad: #ff7a6b; --bad-bg: #3a1d1a;
      --warn: #f2c14e; --warn-bg: #3a3017; --code-bg: #0d1017;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; max-width: 900px; margin: 0 auto; }
  .bar h1 { font-size: 17px; margin: 0 8px 0 0; }
  .grow { flex: 1; }
  button, select, input[type=text] { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ok { color: var(--ok); } button.bad { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; }
  .stats { color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
  .pill { border-radius: 999px; padding: 1px 9px; border: 1px solid var(--line); font-size: 12px; }
  .pill.approved { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
  .pill.rejected { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
  .pill.pending { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
  .check { font-size: 13px; padding: 6px 10px; border-radius: 8px; margin-bottom: 10px; }
  .check.ok { background: var(--ok-bg); color: var(--ok); }
  .check.fail { background: var(--bad-bg); color: var(--bad); }
  .check.none { background: var(--bg); color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .lang { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
  .body p { margin: 0 0 8px; }
  pre.code { background: var(--code-bg); color: var(--code-text); border-radius: 10px; padding: 10px 12px; overflow-x: auto; font: 13.5px/1.45 ui-monospace, Consolas, monospace; margin: 0 0 8px; }
  code.ic { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; font: 13.5px ui-monospace, Consolas, monospace; }
  pre.code code.ic { background: none; border: 0; padding: 0; }
  .k { color: var(--kw); } .s { color: var(--str); } .n { color: var(--num); } .c { color: var(--com); font-style: italic; } .t { color: var(--type); }
  code.ic .k, code.ic .s, code.ic .n, code.ic .t { color: inherit; font-weight: 600; }
  ol.answers { list-style: none; padding: 0; margin: 8px 0; }
  ol.answers li { border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; margin-bottom: 6px; }
  ol.answers li.correct { border-color: var(--ok); background: var(--ok-bg); }
  ol.answers li.correct::before { content: "✔ "; color: var(--ok); font-weight: 700; }
  .expl { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
  textarea { width: 100%; min-height: 54px; font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 60px 16px; }
  .rule { font-size: 13px; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
  .rule b { color: var(--text); }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
  .dirty { color: var(--warn); font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>Quizilla review</h1>
    <button id="open" class="primary">Open batch…</button>
    <button id="openTpl" title="Optional: shows the template rules next to each question">Templates…</button>
    <button id="save" disabled>Save</button>
    <span id="dirty" class="dirty"></span>
    <span class="grow"></span>
    <span id="file" class="stats"></span>
  </div>
  <div class="bar" style="margin-top:8px">
    <select id="fStatus"><option value="">all statuses</option><option>pending</option><option>approved</option><option>rejected</option></select>
    <select id="fCheck"><option value="">any dotnet check</option><option value="ok">check ok</option><option value="fail">check failed</option><option value="none">not checked</option></select>
    <select id="fTemplate"><option value="">all templates</option></select>
    <select id="fView"><option value="one">one at a time</option><option value="list">list</option></select>
    <button id="bulk" title="Approve every pending question in the current filter whose dotnet check is ok">Approve all checked ✔</button>
    <span class="grow"></span>
    <span id="stats" class="stats"></span>
  </div>
</header>
<main id="main"><div class="empty">Open a file from <code>questions/batches/</code>.<br><br>
  Keys: <kbd>A</kbd> approve · <kbd>R</kbd> reject · <kbd>P</kbd> pending · <kbd>←</kbd> <kbd>→</kbd> previous / next · <kbd>Ctrl</kbd>+<kbd>S</kbd> save</div></main>
<input type="file" id="fileInput" accept=".json" hidden>
<input type="file" id="tplInput" accept=".json" hidden>

<script>
// ---------------------------------------------------------------- state
let batch = null, fileName = '', handle = null, dirty = false, pos = 0, templates = new Map();
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- rendering helpers (same Markdown subset as the app)
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const KW = new Set('abstract as base bool break case catch char class const continue decimal default do double else enum false finally float for foreach if in int interface internal is long namespace new null object out override private protected public readonly ref return sealed short static string struct switch this throw true try uint ulong using var virtual void while'.split(' '));
function hl(code) {
  const re = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)')|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const [t] = m;
    if (m[1]) out += `<span class="c">${esc(t)}</span>`;
    else if (m[2] || m[3]) out += `<span class="s">${esc(t)}</span>`;
    else if (m[4]) out += `<span class="n">${t}</span>`;
    else if (KW.has(t)) out += `<span class="k">${t}</span>`;
    else if (/^[A-Z]/.test(t)) out += `<span class="t">${t}</span>`;
    else out += t;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}
function inline(text) {
  return text.split(/(`[^`\n]+`)/g).map((p) =>
    p.length > 2 && p.startsWith('`') && p.endsWith('`')
      ? `<code class="ic">${hl(p.slice(1, -1))}</code>`
      : esc(p).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\*([^*]+)\*/g, '<em>$1</em>').replace(/\n/g, '<br>')
  ).join('');
}
function block(src) {
  const out = [], re = /```([\w#+-]*)[^\S\n]*\n([\s\S]*?)\n?```/g;
  let last = 0, m;
  const text = (t) => t.split(/\n\s*\n/).forEach((p) => { p = p.trim(); if (p) out.push(`<p>${inline(p)}</p>`); });
  while ((m = re.exec(src))) { text(src.slice(last, m.index)); out.push(`<pre class="code"><code>${hl(m[2])}</code></pre>`); last = re.lastIndex; }
  text(src.slice(last));
  return out.join('');
}
function compose(text, code) {
  const t = String(text ?? '').replace(/\r/g, '');
  if (!code) return t.trim();
  return t.replace('{code}', '```csharp\n' + String(code).replace(/\r/g, '').replace(/\n+$/, '') + '\n```').trim();
}

// ---------------------------------------------------------------- filtering
function filtered() {
  if (!batch) return [];
  const s = $('fStatus').value, c = $('fCheck').value, t = $('fTemplate').value;
  return batch.questions.filter((q) =>
    (!s || q.status === s) &&
    (!t || q.template === t) &&
    (!c || (c === 'none' ? !q.check : q.check?.status === c)));
}

function langCol(q, lang) {
  const part = lang === 'sk' ? q.sk : q.en;
  if (!part) return `<div><div class="lang">${lang}</div><p class="stats">— no English version —</p></div>`;
  const answers = part.answers ?? q.sk.answers;
  return `<div>
    <div class="lang">${lang}${lang === 'en' && !part.answers ? ' · answers same as SK' : ''}</div>
    <div class="body">${block(compose(part.body, part.code ?? q.code))}</div>
    <ol class="answers">${answers.map((a, i) => `<li class="${i === 0 ? 'correct' : ''}">${inline(String(a))}</li>`).join('')}</ol>
    ${part.explanation ? `<div class="expl">${inline(part.explanation)}</div>` : ''}
  </div>`;
}

function card(q, idx, total) {
  const tpl = templates.get(q.template);
  const chk = q.check
    ? `<div class="check ${q.check.status}">dotnet: ${q.check.status === 'ok' ? '✔' : '✖'} ${esc(q.check.detail)}</div>`
    : `<div class="check none">dotnet: ${q.verify && q.verify.type !== 'none' ? 'not checked yet' : 'nothing to check (concept question)'}</div>`;
  return `<section class="card" data-id="${esc(q.id)}">
    <div class="meta">
      <b>${esc(q.id)}</b>
      <span class="pill">${esc(q.template)}</span>
      <span class="pill">difficulty ${q.difficulty}</span>
      <span class="pill ${q.status}">${q.status}</span>
      <span class="grow"></span>${idx != null ? `${idx + 1} / ${total}` : ''}
    </div>
    ${chk}
    <div class="cols">${langCol(q, 'sk')}${langCol(q, 'en')}</div>
    ${tpl ? `<div class="rule"><b>Template rules</b> · correct: ${esc(tpl.correct)} · wrong: ${esc(tpl.wrong)}</div>` : ''}
    <div style="margin-top:10px"><textarea placeholder="Note (what to fix) – saved into the batch as &quot;note&quot;" data-note="${esc(q.id)}">${esc(q.note ?? '')}</textarea></div>
    <div class="actions">
      <button class="ok" data-set="approved" data-q="${esc(q.id)}">✔ Approve <kbd>A</kbd></button>
      <button class="bad" data-set="rejected" data-q="${esc(q.id)}">✖ Reject <kbd>R</kbd></button>
      <button data-set="pending" data-q="${esc(q.id)}">Pending <kbd>P</kbd></button>
    </div>
  </section>`;
}

function render() {
  if (!batch) return;
  const list = filtered();
  const qs = batch.questions;
  const n = (s) => qs.filter((q) => q.status === s).length;
  $('stats').textContent = `${list.length} shown · ${n('approved')} approved · ${n('rejected')} rejected · ${n('pending')} pending · ` +
    `dotnet ✔ ${qs.filter((q) => q.check?.status === 'ok').length} ✖ ${qs.filter((q) => q.check?.status === 'fail').length}`;
  $('dirty').textContent = dirty ? '● unsaved changes' : '';
  $('save').disabled = !dirty;
  if (!list.length) { $('main').innerHTML = '<div class="empty">No questions match the filter.</div>'; return; }
  if ($('fView').value === 'list') {
    $('main').innerHTML = list.map((q) => card(q)).join('');
  } else {
    pos = Math.max(0, Math.min(pos, list.length - 1));
    $('main').innerHTML = card(list[pos], pos, list.length) +
      `<div class="actions" style="justify-content:space-between"><button id="prev">← Previous</button><button id="next">Next →</button></div>`;
    $('prev').onclick = () => move(-1);
    $('next').onclick = () => move(1);
  }
}

function move(d) { pos += d; render(); window.scrollTo({ top: 0 }); }

function setStatus(id, status, advance) {
  const q = batch.questions.find((x) => x.id === id);
  if (!q || q.status === status) { if (advance) move(1); return; }
  q.status = status; dirty = true;
  const stillVisible = filtered().some((x) => x.id === id);
  if (advance && stillVisible) pos++;
  render();
}

// ---------------------------------------------------------------- events
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-set]');
  if (b) setStatus(b.dataset.q, b.dataset.set, $('fView').value === 'one');
});
document.addEventListener('input', (e) => {
  const id = e.target.dataset?.note;
  if (!id) return;
  const q = batch.questions.find((x) => x.id === id);
  const v = e.target.value.trim();
  if (v) q.note = e.target.value; else delete q.note;
  dirty = true; $('dirty').textContent = '● unsaved changes'; $('save').disabled = false;
});
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }
  if (!batch || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('fView').value !== 'one') return;
  const q = filtered()[pos];
  if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (q && e.key.toLowerCase() === 'a') setStatus(q.id, 'approved', true);
  else if (q && e.key.toLowerCase() === 'r') setStatus(q.id, 'rejected', true);
  else if (q && e.key.toLowerCase() === 'p') setStatus(q.id, 'pending', true);
});
['fStatus', 'fCheck', 'fTemplate', 'fView'].forEach((id) => ($(id).onchange = () => { pos = 0; render(); }));
$('bulk').onclick = () => {
  const list = filtered().filter((q) => q.status === 'pending' && q.check?.status === 'ok');
  if (!list.length) return alert('No pending questions with a passed dotnet check in the current filter.');
  if (!confirm(`Approve ${list.length} question(s) that passed the dotnet check?`)) return;
  list.forEach((q) => (q.status = 'approved')); dirty = true; render();
};
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

// ---------------------------------------------------------------- open / save
const pickerOpts = { types: [{ description: 'Question batch', accept: { 'application/json': ['.json'] } }] };
function load(text, name) {
  try { batch = JSON.parse(text.replace(/^﻿/, '')); } catch (e) { return alert('Not valid JSON: ' + e.message); }
  if (!Array.isArray(batch.questions)) { batch = null; return alert('This is not a batch file (no "questions").'); }
  fileName = name; dirty = false; pos = 0;
  $('file').textContent = name;
  const tpls = [...new Set(batch.questions.map((q) => q.template))];
  $('fTemplate').innerHTML = '<option value="">all templates</option>' + tpls.map((t) => `<option>${esc(t)}</option>`).join('');
  render();
}
$('open').onclick = async () => {
  if (dirty && !confirm('Discard unsaved changes?')) return;
  if (window.showOpenFilePicker) {
    try { [handle] = await showOpenFilePicker(pickerOpts); const f = await handle.getFile(); load(await f.text(), f.name); } catch {}
  } else $('fileInput').click();
};
$('fileInput').onchange = async (e) => { const f = e.target.files[0]; if (f) { handle = null; load(await f.text(), f.name); } };
$('openTpl').onclick = () => $('tplInput').click();
$('tplInput').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { templates = new Map(JSON.parse(await f.text()).templates.map((t) => [t.id, t])); render(); } catch { alert('Not a templates file.'); }
};
async function save() {
  if (!batch || !dirty) return;
  const text = JSON.stringify(batch, null, 2).replace(/\n/g, '\r\n') + '\r\n';
  if (handle?.createWritable) {
    try { const w = await handle.createWritable(); await w.write(text); await w.close(); dirty = false; render(); return; }
    catch (e) { alert('Could not write the file (' + e.message + ') – downloading a copy instead.'); }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = fileName || 'batch.json'; a.click(); URL.revokeObjectURL(a.href);
  dirty = false; render();
}
$('save').onclick = save;
</script>
</body>
</html>
